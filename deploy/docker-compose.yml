# GenomeCanvas Studio behind nginx (HTTPS).  Usage, from this directory:
#   cp studio.toml studio.local.toml   # edit public_url, paths, auth
#   docker compose up -d --build
#   docker compose exec studio gcanvas-studio --config /etc/genomecanvas/studio.toml user add you@core.edu --admin
# Single sign-on instead of passwords:  set auth = "proxy" in studio.local.toml, use nginx-sso.conf,
# fill oauth2-proxy.cfg and start with:  docker compose --profile sso up -d
services:
  studio:
    build:
      context: ..
      dockerfile: Dockerfile
    image: genomecanvas-studio:latest
    restart: unless-stopped
    volumes:
      - ./studio.local.toml:/etc/genomecanvas/studio.toml:ro
      - /data/core/deliverables:/data/deliverables:ro   # project folders (read-only)
      - /data/core/annotations:/data/annotations:ro     # shared <genome>/genes.gtf etc.
      - workspace:/srv/genomecanvas                      # database, uploads, results, cache
    expose:
      - "8765"
    mem_limit: 16g        # workers x worker_memory_mb + headroom
    cpus: 8

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [studio]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro   # or ./nginx-sso.conf with the sso profile
      - ./certs:/etc/nginx/certs:ro                      # fullchain.pem + privkey.pem

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    profiles: ["sso"]
    restart: unless-stopped
    command: ["--config=/etc/oauth2-proxy.cfg"]
    volumes:
      - ./oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
    expose:
      - "4180"

volumes:
  workspace:
