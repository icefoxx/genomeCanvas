# nginx in front of GenomeCanvas Studio with password accounts (auth = "local").
server {
    listen 80;
    server_name figures.core.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name figures.core.example.edu;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2g;          # keep in line with max_upload_mb
    proxy_request_buffering off;      # stream uploads straight to the studio
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        proxy_pass http://studio:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never forward identity headers a client might have set itself.
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Auth-Request-User "";
    }
}
