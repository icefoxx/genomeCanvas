[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genomecanvas"
version = "0.1.0"
description = "A declarative, reproducible genomic figure engine."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "GenomeCanvas contributors" }]
dependencies = ["matplotlib>=3.7", "numpy>=1.24", "pydantic>=1.10", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6"]
bigwig = ["pyBigWig>=0.3.25", "pybigtools>=0.2"]
studio = ["pyBigWig>=0.3.25", "scipy>=1.10", "scikit-learn>=1.3", "plotly>=5.9"]

[project.scripts]
gcanvas = "genomecanvas.cli.main:main"
gcanvas-studio = "genomecanvas.studio.cli:main"
gcanvas-profileseg = "genomecanvas.profileseg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genomecanvas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["genomecanvas"]
mypy_path = "src"
